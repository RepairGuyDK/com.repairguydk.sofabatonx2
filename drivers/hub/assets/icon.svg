      <!-- nav row -->
      <circle cx="224" cy="280" r="9" fill="#000"/>
      <circle cx="256" cy="280" r="9" fill="#000"/>
      <circle cx="288" cy="280" r="9" fill="#000"/>
      <!-- volume / guide / channel -->
      <rect x="210" y="300" width="20" height="46" rx="10" fill="#000"/>
      <circle cx="256" cy="312" r="10" fill="#000"/>
      <rect x="282" y="300" width="20" height="46" rx="10" fill="#000"/>
